current:
  - name: Gustavo Díaz Cruz
    role: Principal Investigator
    photo: /assets/img/gustavo_site.jpg
    description: I am originally from the small town of Cedral, Montes de Oro, Puntarenas. Always surrounded by nature and agriculture, I wanted to be a scientist from an early age, inspired by the first Costa Rican astronaut Dr. Franklin Chang-Díaz (not related!)..

  - name: Mario Salas Montero
    role: Licenciatura student
    photo: /assets/img/mario_site.jpg
    description: Mario has a BSc in Agronomy from the University of Costa Rica. “I am passionate about plant pathology, with experience in pathogen isolation, and both lab and greenhouse fungicide testing trials. My Licenciatura thesis looks at characterizing different isolates from the Botryosphaeriaceae family obtained from different hosts in Costa Rica, as well as evaluating their sensitivity to fungicides”.

  - name: Arturo Gutiérrez Pizarro
    role: Licenciatura student
    photo: /assets/img/arturo_site.jpg
    description: Arturo has a BSc in Agronomy from University of Costa Rica and a BSc in Natural Sciences teaching from UNED. He works as a consultant and advisor for different crops in Cartago, and has interest in responsible use of pesticides. His thesis work is looking into the Stemphylium species associated with onion and their sensitivity to fungicides..

  - name: Andrey Sánchez Jara
    role: Licenciatura student
    photo: /assets/img/andrey_site.jpg
    description: Andrey has a BSc in Agronomy from University of Costa Rica. His thesis work is about chemical and biological control of Phytophthora affecting pineapple.

